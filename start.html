<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محراب الحفظ والمراجعة</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px;background:#f4f7f5;color:#14532d">
<p>⏳ جارٍ فتح التطبيق...</p>
<script>
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      await navigator.serviceWorker.register('sw.js');
      await Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(r, 8000))]);
    }
  } catch (e) {}
  location.replace('index.html');
})();
</script>
</body>
</html>
